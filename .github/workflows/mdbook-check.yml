# Validate mdBook builds on pull requests (no deploy).
name: mdBook build check

on:
  pull_request:
    branches: ["master"]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mdbook-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: "0.5.4"
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook (prebuilt binary)
        run: |
          mkdir -p "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
      - name: Build with mdBook
        run: mdbook build
